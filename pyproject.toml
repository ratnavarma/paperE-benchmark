[project]
name = "papere"
version = "0.1.0"
description = "Track E PGAI4E note: delayed telemetry, silent setpoint failure and hedging under a shared setpoint cap"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papere"]
